<!DOCTYPE html>
<html>
<head>
    <title>First JavaScript Program</title>
</head>
<body>
    <script>
        n = 2
        if (n % 2 == 0){
            document.write('<h3>' + n + ' is even' + '</h3>')
        }
        else{
            document.write('<h3>' + n + ' is odd' + '</h3>')
        }
    </script>    
</body>
</html>
