<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
        <title>Comments in JavaScript</title>
    </head>
    <body>
        <script src="script.js"></script>
        <p>In JavaScript we can write single line comments using <span class="monospace">//</span></p>
        <p>For example,<br/><span class="monospace">// This is a single line comment.</span></p>
        <p>To write multi-line comments, we can use <span class="monospace">/* */</span></p>
        <p>For example,<br/><span class="monospace">/* This is<br/>a multi-line<br/>comment.*/</span></p>
    </body>
</html>
